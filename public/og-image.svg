<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b0f19"/>
  
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="2" fill="rgba(99, 102, 241, 0.15)"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(470, 160)">
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
    <text x="84" y="42" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#818cf8" letter-spacing="2">IIIT BHOPAL</text>
  </g>

  <text x="600" y="300" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)" text-anchor="middle">Deeya Meena</text>

  <text x="600" y="360" font-family="system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" text-anchor="middle">Software Developer &amp; Full Stack Engineer | Next.js • React • C++ • Cloud &amp; AI</text>

  <g transform="translate(370, 420)">
    <rect x="0" y="0" width="145" height="40" rx="20" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
    <text x="72.5" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">Full Stack Web</text>

    <rect x="160" y="0" width="130" height="40" rx="20" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="225" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="middle">AI &amp; Cloud</text>

    <rect x="305" y="0" width="165" height="40" rx="20" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="387.5" y="25" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#6ee7b7" text-anchor="middle">ECE @ IIIT Bhopal</text>
  </g>
</svg>
